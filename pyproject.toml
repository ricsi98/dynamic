[project]
name = "dynamic"
version = "1.0.0"
description = "DyNAMiC: one-hop neighbourhood attention for link prediction with unseen entities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dynamic"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["dynamic.model.ModelConfig", "dynamic.train.TrainConfig"]
